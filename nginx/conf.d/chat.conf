upstream chat_backend {
    server chat-app:3000;
    keepalive 32;
}

# 1. HTTP Server - Redirects to HTTPS and serves basic health check
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Nginx Container Healthcheck Endpoint
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect all other HTTP traffic to HTTPS (Port 8443)
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy with TLS termination and WebSocket support
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # SSL Certificates (Self-signed demo certificate)
    ssl_certificate /etc/nginx/certs/chat.crt;
    ssl_certificate_key /etc/nginx/certs/chat.key;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx Healthcheck on HTTPS
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Socket.IO Real-time WebSocket Upgrade
    location /socket.io/ {
        proxy_pass http://chat_backend/socket.io/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts to keep persistent WebSocket connections open
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        proxy_buffering off;
    }

    # REST API & Static Frontend Reverse Proxy
    location / {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffer configuration for HTTP
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

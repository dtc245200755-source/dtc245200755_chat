<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập Internal Chat — Hệ Thống Nhắn Tin Nội Bộ Thời Gian Thực">
  <title>Đăng Nhập — Internal Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-brand-logo" title="Internal Chat">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <h1 class="auth-title">Internal Chat</h1>
      <p class="auth-subtitle">Kết nối đội ngũ — Nhắn tin thời gian thực</p>
    </div>

    <!-- Switch between Login & Register -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tab-login" role="tab" aria-selected="true">Đăng Nhập</button>
      <button type="button" class="auth-tab" id="tab-register" role="tab" aria-selected="false">Đăng Ký Tài Khoản</button>
    </div>

    <!-- Alert Message Box -->
    <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px; font-weight: 600;"></div>

    <!-- Login Form -->
    <form id="form-login">
      <div class="form-field">
        <label class="form-label" for="login-username">Tên đăng nhập hoặc Email</label>
        <input type="text" id="login-username" class="form-input" placeholder="Nhập tên đăng nhập" required autocomplete="username">
      </div>
      
      <div class="form-field">
        <label class="form-label" for="login-password">Mật khẩu</label>
        <div class="password-input-wrapper">
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn-toggle-password" id="toggle-login-password" title="Hiện/ẩn mật khẩu">👁️</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 12.5px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-body);">
          <input type="checkbox" id="login-remember" checked style="accent-color: var(--primary-pink);">
          <span>Ghi nhớ phiên đăng nhập</span>
        </label>
        <a href="javascript:void(0)" id="link-forgot-pass" style="color: var(--primary-pink); text-decoration: none; font-weight: 600;">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit" style="width: 100%; padding: 12px; font-size: 14.5px;" id="btn-login-submit">
        Đăng Nhập Vào Internal Chat
      </button>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="form-register" style="display: none;">
      <div class="form-field">
        <label class="form-label" for="reg-displayname">Tên hiển thị của bạn *</label>
        <input type="text" id="reg-displayname" class="form-input" placeholder="VD: Hoàng Văn A" required maxlength="50">
      </div>

      <div class="form-field">
        <label class="form-label" for="reg-username">Tên đăng nhập (Username) *</label>
        <input type="text" id="reg-username" class="form-input" placeholder="Chỉ chứa chữ cái, số (VD: hoang_va)" required maxlength="30">
      </div>

      <div class="form-field">
        <label class="form-label" for="reg-email">Email (tùy chọn)</label>
        <input type="email" id="reg-email" class="form-input" placeholder="VD: hoang@company.local">
      </div>

      <div class="form-field">
        <label class="form-label" for="reg-password">Mật khẩu *</label>
        <div class="password-input-wrapper">
          <input type="password" id="reg-password" class="form-input" placeholder="Tối thiểu 6 ký tự" required minlength="6">
          <button type="button" class="btn-toggle-password" id="toggle-reg-password" title="Hiện/ẩn mật khẩu">👁️</button>
        </div>
        <div class="password-strength-bar">
          <div class="password-strength-fill" id="pass-strength-meter"></div>
        </div>
        <span id="pass-strength-text" style="font-size: 11px; color: var(--text-muted); margin-top: 3px;"></span>
      </div>

      <div class="form-field">
        <label class="form-label" for="reg-password-confirm">Xác nhận lại mật khẩu *</label>
        <div class="password-input-wrapper">
          <input type="password" id="reg-password-confirm" class="form-input" placeholder="Nhập lại mật khẩu" required minlength="6">
          <button type="button" class="btn-toggle-password" id="toggle-reg-confirm" title="Hiện/ẩn mật khẩu">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" style="width: 100%; padding: 12px; font-size: 14.5px;" id="btn-register-submit">
        Tạo Tài Khoản Internal Chat
      </button>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

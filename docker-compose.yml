# ====================================================================
# DOCKER COMPOSE ORCHESTRATION — DE 32 CHAT/MESSAGING SYSTEM
# Architecture: Multi-tier, segmented networks, observable, hardened
# ====================================================================

name: mssv-de32-chat-system

services:
  # ------------------------------------------------------------------
  # 1. Reverse Proxy & TLS Termination
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: chat-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8084}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - frontend-net
      - logging-net
    depends_on:
      chat-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ------------------------------------------------------------------
  # 2. Application Backend (Node.js + Socket.IO + Express)
  # ------------------------------------------------------------------
  chat-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chat_db}
      DB_USER: ${DB_USER:-chat_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
      - logging-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ------------------------------------------------------------------
  # 3. PostgreSQL Relational Database (Internal Only - Not Bound to Host)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      # Superuser (quản trị) — tách biệt hoàn toàn với tài khoản ứng dụng chat
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_NAME:-chat_db}
      # Tài khoản ứng dụng (least-privilege) — do 002_init_app_user.sh tạo & cấp quyền tối thiểu
      APP_USER: ${DB_USER:-chat_user}
      APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./database/migrations/002_init_app_user.sh:/docker-entrypoint-initdb.d/002_init_app_user.sh:ro
    networks:
      - backend-net
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-chat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ------------------------------------------------------------------
  # 4. Database Administration (pgAdmin 4)
  # ------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: chat-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required in .env}
      # SERVER_MODE mặc định = True (bắt buộc đăng nhập email/mật khẩu) — đã bỏ hai cờ tắt xác thực cũ
    ports:
      # Chỉ mở trên loopback (localhost) để hạn chế truy cập giao diện quản trị DB từ bên ngoài
      - "127.0.0.1:${PGADMIN_PORT:-5052}:80"
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # ------------------------------------------------------------------
  # 5. Prometheus Time-series Monitoring Server
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: chat-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ------------------------------------------------------------------
  # 6. Grafana Metrics & Log Visualization Dashboard
  # ------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: chat-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
      - logging-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ------------------------------------------------------------------
  # 7. Grafana Loki Centralized Log Aggregator
  # ------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: chat-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - logging-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # ------------------------------------------------------------------
  # 8. Promtail Docker Log Shipper
  # ------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    container_name: chat-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - logging-net
    depends_on:
      loki:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ------------------------------------------------------------------
  # 9. Host OS Metrics Exporter (Node Exporter)
  # ------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: chat-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - monitoring-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ------------------------------------------------------------------
  # 10. Container Resource Metrics (cAdvisor)
  # ------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: chat-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ------------------------------------------------------------------
  # 11. PostgreSQL Metrics Exporter
  # ------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: chat-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-chat_user}:${DB_PASSWORD:?DB_PASSWORD is required in .env}@postgres:5432/${DB_NAME:-chat_db}?sslmode=disable"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

# --------------------------------------------------------------------
# NETWORKS DEFINITIONS (Segmented Architecture)
# --------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  logging-net:
    driver: bridge

# --------------------------------------------------------------------
# VOLUMES DEFINITIONS (Data Persistence)
# --------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
